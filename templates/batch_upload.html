<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استيراد وتحليل ملفات العينات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold text-teal-400">استيراد وتحليل عينات المختبر بالجملة</h1>
                <p class="text-sm text-slate-400 mt-1">ارفع ملف CSV أو Excel لتطبيق محرك الفرز الذكي وتصدير التقرير المحلل فوراً</p>
            </div>
            <div class="flex gap-3">
                <a href="/" class="px-4 py-2 bg-slate-700 text-slate-200 rounded-xl text-sm font-bold hover:bg-slate-600">الاستقبال</a>
                <a href="/lab-console" class="px-4 py-2 bg-slate-700 text-slate-200 rounded-xl text-sm font-bold hover:bg-slate-600">محطة المختبر</a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Option 1: Import into database -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-teal-300 border-b border-slate-700 pb-2">حفظ السجلات في قاعدة البيانات المحلية</h2>
                <form action="/process-batch" method="POST" enctype="multipart/form-data" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2">اختر ملف البيانات (CSV / Excel)</label>
                        <input type="file" name="file" accept=".csv, .xlsx" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full py-3 bg-teal-500 text-slate-950 font-bold rounded-xl text-sm shadow hover:bg-teal-400 transition">رفع ومعالجة داخل قاعدة البيانات</button>
                </form>
            </div>

            <!-- Option 2: Export Analyzed Report Button -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-teal-300 border-b border-slate-700 pb-2">تصدير وتحليل الملف فورا (Export & Analyze)</h2>
                <form action="/export-analyzed-file" method="POST" enctype="multipart/form-data" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2">اختر ملف العينات لتحليله وتصديره كتقرير جاهز</label>
                        <input type="file" name="file" accept=".csv, .xlsx" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl text-sm shadow hover:bg-purple-500 transition">تحليل الملف وتنزيل التقرير المحدث (CSV)</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
